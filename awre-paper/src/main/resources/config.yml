# AWRE G0 configuration. All values are validated and clamped at load; invalid sets fall back to safe defaults.
enabled: true
# Send one deterministic test tile for the player's chunk right after a successful handshake (G0 acceptance test).
auto-send-test-tile: true
debug: false
# CI/diagnostics: after the handshake also send one fragmented noise tile of this side (0 = off, 16..256; 128 = 32 KiB raw).
auto-fragment-test-side: 0
# Terrain streaming (G1). Streams quadtree LOD tiles to every AWRE client. The terrain source is SYNTHETIC (made-up, labelled
# PREDICTED); synthetic-chunk-radius N fills (2N+1)^2 chunks around 0,0 (0 = none). source: captured ignores it and reads loaded chunks
# as players move around (with persist: true it is also kept on disk and replayed after a restart; the file of a world is created by its first observed chunk).
stream:
  enabled: false
  source: synthetic               # synthetic = made-up PREDICTED terrain (see below); captured = real chunks the server has loaded (OBSERVED)
  import-horizon-cache: true      # first start only: copy plugins/HorizonField/cache/<world>.hfl (same format and fingerprint) if AWRE has no file yet
  persist: true                   # captured mode: keep terrain on disk (plugins/AWRE/terrain/<world>.hfl), replayed at start
  synthetic-chunk-radius: 0       # 0..99 (99 = 39 601 chunks, about 50 MB)
  radius: 1000                    # blocks, 256..8000. The client's projection far plane was measured at 2048 blocks (1.21.11): above ~2000 the extra tiles are clipped
  bytes-per-second: 250000        # per player, ASSUMED budget
  max-held-tiles: 4096            # 64..4096: a client meshes and keeps at most 4096 tiles resident (more would be held but never drawn)
  compact-garbage-ratio: 0.5      # 0.1..0.95: rewrite a world's cache file when this share of its tile records is superseded (checked every 30 s)
  compact-min-bytes: 1048576      # ...and the file is at least this big (0 = size does not matter)
  revalidate-seconds: 600         # 0..86400, captured mode: re-observe every loaded chunk this often (0 = only on load and on block events). Catches WorldEdit, fluids, other plugins. Main-thread cost: one ChunkSnapshot per chunk at <= 2 per tick within a 0.5 ms budget (NOT yet measured on a real server)
  capture-budget-micros: 500      # 100..5000: AVERAGE main-thread time per tick that chunk capture (snapshots and the periodic sweep) may use. A snapshot costing more than this still runs, just less often. 0.5 ms = 1% of a 50 ms tick. NOT yet validated on a real server (the only measurement: 187 chunks on a CI runner, snapshot p99 4.45 ms)
  skip-ceiling-worlds: true       # true: worlds with a ceiling (the Nether) are neither captured nor streamed, because a one-surface-per-column terrain of them is their bedrock roof. false: stream it anyway. Datapack dimensions with a ceiling are not detected.
  store-full-policy: evict-oldest # evict-oldest | refuse-new. What a full per-world store does with a chunk at a NEW coordinate: evict-oldest removes the least recently observed chunks (the store follows where players are; one O(n) scan per cap/64 admissions, tens to hundreds of ms on the ingest thread, never the main thread); refuse-new keeps whatever was captured first. Evicted chunks stay in the on-disk cache.
  max-store-mib: 0                # 0..65536, memory budget for observed terrain PER WORLD (about 450 bytes per chunk). 0 = automatic: min(512 MiB, 1/8 of the max heap). When full, chunks at NEW coordinates are not captured (stored ones keep updating); a warning is logged.
  retry-cooldown-seconds: 60      # 5..3600, a tile a client keeps failing to accept is held back this long before one more attempt (doubles per further failure, up to 16x; a changed tile is retried at once)
limits:
  max-frame-bytes: 16384          # per message; hard ceiling 32000 (one plugin message, no fragmentation in G0)
  max-decoded-tile-bytes: 65536   # per tile after inflate
  max-lod: 8
  max-in-flight-tiles: 4          # unacknowledged tiles per player
  hello-burst: 3
  hello-refill-per-sec: 0.1       # one HELLO per 10 s sustained
  tile-burst: 4
  tile-refill-per-sec: 2.0
  strike-limit: 5                 # malformed frames before a player's session is ignored until reconnect

diagnostics:
  report-seconds: 0               # 0 = no timer. 10..86400: append one JSON line of RESULTS (config, MSPT window, counters, per-player stream stats, heap) to plugins/AWRE/reports/awre-report.jsonl every N seconds and once at shutdown. /awre report writes one on demand. Rotated at 8 MiB (one backup). Client-side results are NOT included (the protocol has no client statistics message).
  mspt-seconds: 0                 # 0 = off. > 0: log server MSPT percentiles (p50/p95/p99/max over the last period) every N seconds, independent of stream.enabled. For an A/B: same server, stream.enabled false (baseline) then true. See docs/MEASUREMENT_PLAN.md
