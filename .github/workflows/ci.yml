# CI for Horizon Field / AWRE. The integration job has run green end to end (G0, G1 and G1c checks); pin versions below before relying on it.
# Jobs:  verify (pure Java, no downloads)  ->  build (Gradle: Paper + Fabric)  ->  smoke (MC-Runtime-Test)  and  integration (Paper server + Fabric client).
# First failures are expected; every job uploads its logs. Bump pinned versions as noted.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mc_version:
        description: Minecraft version
        default: "1.21.11"
      render_smoke:
        description: "Make render counters mandatory in the integration job (opt-in; default CI stays informational)"
        type: boolean
        default: false
      client_render_distance:
        description: "Client renderDistance for the integration job (default 12 = Minecraft default; server view-distance is 4)"
        type: string
        default: ""
      pixel_check:
        description: "Opt-in: run one NON-headless client under Xvfb + Mesa software GL and prove from real framebuffer captures (AWRE on vs same-session control) that terrain is visible. Adds a client start; inconclusive results are informational"
        type: boolean
        default: false
      compat_mods:
        description: "Opt-in compat clients, one per group, e.g. 'sodium sodium+iris bobby vulkanmod' ('+' joins mods that load together). Informational: results go to the summary, a failure does not fail the job"
        type: string
        default: ""

env:
  MC_VERSION: ${{ inputs.mc_version || '1.21.11' }}
  GRADLE_VERSION: "9.2.1"          # >= 9.1 (root) and = 9.2.1 (awre-fabric wrapper properties)
  JAVA_VERSION: "21"               # 21 for MC 1.20.5 - 1.21.x

jobs:
  verify:
    name: Pure-Java tests (no Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: bash tools/verify-core.sh
      - run: bash tools/verify-awre.sh
      - run: bash tools/verify-stream.sh
      - run: bash tools/ci/render-gate-test.sh
      - run: bash tools/ci/frame-check-test.sh
      - run: bash tools/ci/compat-lib-test.sh
      - run: bash tools/ci/report-check-test.sh       # the server result-report validator, incl. every case that must fail
      - run: bash tools/ci/pixel-check-test.sh        # real-framebuffer proof orchestration, against a mock display and client
      - run: bash tools/ci/api-dump-regex-test.sh     # every api-dump class regex must match the class it dumps
      - run: bash tools/feedback-test.sh              # feedback.sh against a mock Gradle
      - run: bash tools/ci/log-scan-test.sh          # stack-aware exception scan, convergence and noise classification, against real log excerpts
      - name: Reference frames (CPU geometry check of the real LOD plan + meshes; not an in-game render)
        run: bash tools/preview/run-reference-frame.sh reference-frames
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: reference-frames, path: reference-frames/*.png, if-no-files-found: warn }
      - name: Reveal-effect preview (CPU model of the terrain reveal; self-checks start/spread/grey/clean end; not the real shader)
        run: bash tools/preview/run-reveal-preview.sh reveal-frames
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: reveal-frames, path: reveal-frames/*, if-no-files-found: warn }

  build:
    name: Build Paper plugins + Fabric mod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Root build (horizon-core, horizon-paper, awre-protocol, awre-paper) with tests
        run: gradle build -PjavaRelease=21 --stacktrace
      - name: Fabric build (separate Loom build)
        run: gradle -p awre-fabric build --stacktrace
      - name: Dump real Minecraft/Fabric API signatures (javap) for the next porting step
        continue-on-error: true            # diagnostic only: never fails the build
        run: bash tools/ci/api-dump.sh mc-api-dump
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: mc-api-dump, path: mc-api-dump/, if-no-files-found: warn }
      - name: Collect jars
        run: |
          mkdir -p jars
          cp awre-paper/build/libs/AWRE-Paper-*.jar jars/
          cp horizon-paper/build/libs/HorizonField-*.jar jars/
          cp awre-fabric/build/libs/awre-fabric-*[0-9].jar jars/      # skips the -sources jar
          ls -l jars
      - uses: actions/upload-artifact@v4
        with: { name: jars, path: jars/*.jar, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-reports
          path: |
            **/build/reports/tests
            **/build/test-results
          if-no-files-found: ignore

  smoke:
    name: Client smoke test (MC-Runtime-Test)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/download-artifact@v4
        with: { name: jars, path: jars }
      - name: Stage mod for the test client
        run: |
          mkdir -p run/mods
          cp jars/awre-fabric-*.jar run/mods/
      - name: Launch client with the mod, join a world, quit
        uses: headlesshq/mc-runtime-test@4.5.2     # newest tag: https://github.com/headlesshq/mc-runtime-test/releases
        with:
          mc: ${{ env.MC_VERSION }}
          modloader: fabric
          regex: .*fabric.*
          mc-runtime-test: fabric
          java: 21
          fabric-api: "0.141.3"                    # the action appends "+<mc version>" itself (CI run 1: "+1.21.11" given twice -> 404). Keep in step with fabric_version in awre-fabric/gradle.properties

  integration:
    name: Paper server + Fabric client (headless)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/download-artifact@v4
        with: { name: jars, path: jars }
      - name: Install HeadlessMc (official release, native Linux x64)
        env:
          GH_TOKEN: ${{ github.token }}
          HMC_TAG: ""                              # empty = latest; pin a tag for reproducible runs
        run: |
          mkdir -p "$HOME/bin"
          gh release download ${HMC_TAG:+"$HMC_TAG"} --repo headlesshq/headlessmc --pattern 'headlessmc-launcher-linux-x64' --output "$HOME/bin/headlessmc"
          chmod +x "$HOME/bin/headlessmc"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/headlessmc" --version
      - name: Install display stack for the pixel check (opt-in)
        if: ${{ inputs.pixel_check }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb imagemagick mesa-utils x11-utils libgl1-mesa-dri
      - name: Run integration (see tools/ci/integration.sh for the exact checks)
        env:
          PIXEL_CHECK: ${{ inputs.pixel_check && '1' || '0' }}     # opt-in via workflow_dispatch; see tools/ci/pixel-check.sh
          RENDER_SMOKE: ${{ inputs.render_smoke && '1' || '0' }}   # opt-in via workflow_dispatch; render counters are mandatory only when 1
          CLIENT_RENDER_DISTANCE: ${{ inputs.client_render_distance }}      # empty = harness default (12)
          COMPAT_MODS: ${{ inputs.compat_mods }}                   # opt-in via workflow_dispatch; empty = no compat clients
        run: bash tools/ci/integration.sh jars
      - name: Summary
        if: always()
        run: '[ -f ci-out/summary.md ] && cat ci-out/summary.md >> "$GITHUB_STEP_SUMMARY" || echo "no summary produced" >> "$GITHUB_STEP_SUMMARY"'
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: integration-logs, path: ci-out/, if-no-files-found: warn }
